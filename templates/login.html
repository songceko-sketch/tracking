<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – NexaTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; }
    .glass-input:focus { outline: none; border-color: rgba(6,182,212,0.5); box-shadow: 0 0 0 3px rgba(6,182,212,0.1); }
    .glass-input::placeholder { color: #475569; }
    .glow { box-shadow: 0 0 40px rgba(6,182,212,0.2); }
    .glow-btn { box-shadow: 0 0 20px rgba(6,182,212,0.4); }
  </style>
</head>
<body class="min-h-screen bg-[#020817] flex items-center justify-center px-4" style="background: radial-gradient(ellipse at 50% 0%, rgba(6,182,212,0.1) 0%, transparent 60%), #020817;">

  <div class="w-full max-w-md">

    <!-- Back to home -->
    <div class="mb-6">
      <a href="/" class="inline-flex items-center gap-1.5 text-slate-400 hover:text-white text-sm transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Home
      </a>
    </div>

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-600/30">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0v10l-8 4m0-14L4 17m8 4V11"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Nexa<span class="text-cyan-400">Track</span></h1>
      <p class="text-slate-400 mt-1 text-sm">Logistics Management Platform</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl shadow-2xl p-8 glow">
      <h2 class="text-xl font-semibold text-white mb-6">Sign in to your account</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="mb-5 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
          <input name="username" type="text" required autocomplete="username"
            class="glass-input w-full px-4 py-2.5 rounded-lg text-sm transition"
            placeholder="Enter your username"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
          <input name="password" type="password" required autocomplete="current-password"
            class="glass-input w-full px-4 py-2.5 rounded-lg text-sm transition"
            placeholder="Enter your password"/>
        </div>
        <button type="submit"
          class="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-lg transition text-sm glow-btn">
          Sign In →
        </button>
      </form>

      <div class="mt-5 pt-5 border-t border-white/5 text-center">
        <p class="text-slate-400 text-xs">
          Don't have an account?
          <a href="/track" class="text-blue-400 hover:text-blue-300 transition">Track without login →</a>
        </p>
      </div>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">© 2025 NexaTrack. All rights reserved.</p>
  </div>

</body>
</html>
